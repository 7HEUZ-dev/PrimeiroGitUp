<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produtos • PãoQuentinho</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <style>
    :root { --primary: #ea580c; --bg: #fffdf9; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; }
    .shell { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
    
    /* Sidebar */
    .sidebar { background: #fff; border-right: 1px solid #e5e7eb; padding: 24px; position: sticky; top: 0; height: 100vh; }
    .menu { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
    .menu a { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; color: #4b5563; text-decoration: none; transition: 0.2s; }
    .menu a:hover { background: #fef2f2; color: var(--primary); }
    .menu a.active { background: #fff1e6; color: var(--primary); font-weight: 600; }
    
    /* Content */
    .main-content { padding: 40px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    
    /* Tabela */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { text-align: left; padding: 12px; border-bottom: 2px solid #eee; color: #6b7280; font-size: 0.875rem; }
    td { padding: 15px 12px; border-bottom: 1px solid #f9f9f9; }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
    .bg-success { background: #dcfce7; color: #166534; }
    .bg-error { background: #fee2e2; color: #991b1b; }

    /* Modal */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 999; }
    .modal-content { background: #fff; padding: 30px; border-radius: 20px; width: 100%; max-width: 450px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
    label { display: block; font-weight: 600; margin-bottom: 4px; color: #374151; }
    input { width: 100%; padding: 12px; margin-bottom: 16px; border: 1px solid #d1d5db; border-radius: 10px; box-sizing: border-box; outline: none; transition: 0.2s; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.1); }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div style="font-size: 1.5rem; font-weight: bold; color: var(--primary)">🍞 PãoQuentinho</div>
      <nav class="menu">
        <a href="./dono.html">🏠 Dashboard</a>
        <a href="./pedidos.html">🧾 Pedidos</a>
        <a href="./produtos.html" class="active">📦 Produtos</a>
        <a href="./clientes.html">👥 Clientes</a>
        <a href="./config.html">⚙️ Configurações</a>
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        <a href="#" onclick="sair()" style="color: #dc2626;">🚪 Sair</a>
      </nav>
    </aside>

    <main class="main-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <div>
          <h1 style="margin:0">Meus Produtos</h1>
          <p style="color: #6b7280; margin: 4px 0 0">Gerencie o cardápio da sua padaria</p>
        </div>
        <button class="btn btn-primary" onclick="abrirModal()">+ Adicionar Produto</button>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Produto</th>
              <th>Preço</th>
              <th>Estoque</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tabela-corpo">
            <tr><td colspan="4" style="text-align:center">Carregando produtos...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="modalProd" class="modal">
    <div class="modal-content">
      <h2 style="margin-top: 0; font-family: 'Inter', sans-serif;">Novo Produto</h2>
      <form id="formCadastro">
        <label for="nome">Nome do item</label>
        <input type="text" id="nome" required placeholder="Ex: Pão de Queijo">
        
        <label for="preco">Preço de venda (R$)</label>
        <input type="number" id="preco" step="0.01" required placeholder="0.00">
        
        <label for="estoque">Quantidade em estoque</label>
        <input type="number" id="estoque" required placeholder="0">
        
        <div style="display: flex; gap: 10px; margin-top: 10px;">
          <button type="submit" class="btn btn-primary" style="flex: 2">Salvar Produto</button>
          <button type="button" class="btn btn-white" onclick="fecharModal()" style="flex: 1">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const API_URL = 'http://localhost:4000';

    // Se não tiver token, volta pro login
    if (!token) window.location.href = './login.html';

    async function carregarProdutos() {
      try {
        const res = await fetch(`${API_URL}/produtos`, {
          method: 'GET',
          headers: { 
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });
        
        if (res.status === 401) return sair();
        
        const produtos = await res.json();
        const corpo = document.getElementById('tabela-corpo');
        
        if (produtos.length === 0) {
          corpo.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:30px; color:#9ca3af">Nenhum produto cadastrado ainda.</td></tr>';
          return;
        }

        corpo.innerHTML = produtos.map(p => `
          <tr>
            <td style="font-weight: 500; color: #111827;">${p.nome}</td>
            <td>R$ ${Number(p.preco).toFixed(2).replace('.', ',')}</td>
            <td>${p.estoque} un</td>
            <td>
              <span class="badge ${p.disponivel ? 'bg-success' : 'bg-error'}">
                ${p.disponivel ? '✅ Ativo' : '❌ Pausado'}
              </span>
            </td>
          </tr>
        `).join('');
      } catch (e) {
        console.error("Erro ao carregar:", e);
        document.getElementById('tabela-corpo').innerHTML = '<tr><td colspan="4" style="text-align:center; color:red">Erro ao conectar com o servidor.</td></tr>';
      }
    }

    document.getElementById('formCadastro').onsubmit = async (e) => {
      e.preventDefault();
      
      const payload = {
        nome: document.getElementById('nome').value,
        preco: parseFloat(document.getElementById('preco').value),
        estoque: parseInt(document.getElementById('estoque').value),
        disponivel: true
      };

      try {
        const res = await fetch(`${API_URL}/produtos`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` 
          },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          fecharModal();
          document.getElementById('formCadastro').reset();
          await carregarProdutos(); // Recarrega a lista automaticamente
        } else {
          const erro = await res.json();
          alert('Erro: ' + (erro.message || 'Não foi possível salvar o produto.'));
        }
      } catch (err) {
        alert('Erro de conexão com o servidor.');
      }
    };

    function abrirModal() { document.getElementById('modalProd').style.display = 'flex'; }
    function fecharModal() { document.getElementById('modalProd').style.display = 'none'; }
    function sair() { localStorage.clear(); window.location.href = './login.html'; }

    // Inicia a listagem ao abrir a página
    carregarProdutos();
  </script>
</body>
</html>
